<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生命年表</title>
<style>
:root{
  --night:#1b2430; --panel:#14202b; --line:#e8dcc0; --lit:#f2c14e; --dim:#6f7f93; --deep:#8ea0c4;
  /* 想換像素字型（例如俐方體11號）就改這一行 */
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--night);color:var(--line);font-family:var(--font)}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px;gap:10px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:relative;width:100%;max-width:704px;container-type:inline-size;display:flex;flex-direction:column;
  border:3px solid var(--line);outline:3px solid var(--panel);outline-offset:-6px;background:#0f161e;overflow:hidden}
canvas{width:100%;height:auto;aspect-ratio:352/288;display:block;transition:filter .6s;flex:0 0 auto}
#stage{flex:0 0 auto}
@media (max-height:600px){ #dpad{grid-template:repeat(3,44px)/repeat(3,44px)!important} #btnA{width:70px!important;height:70px!important} body{gap:6px!important;padding:6px!important} }
#stage.quiet canvas{filter:brightness(.4) saturate(.5)}
button{font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);cursor:pointer;padding:.35em .7em}
button:focus-visible{outline:3px solid var(--lit);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}

#hud{position:static;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;
  padding:1.6cqw 1.6cqw 1cqw;font-size:clamp(11px,3.1cqw,16px)}
#hud[hidden],#tick[hidden]{display:flex!important;visibility:hidden}
#count{background:rgba(20,32,43,.85);padding:.2em .6em;border:2px solid var(--line)}
#count b{color:var(--lit)}
#hudBtns{display:flex;gap:.4em}
#hudBtns button{padding:.2em .55em}

#dlg{position:absolute;left:2cqw;right:2cqw;bottom:2cqw;min-height:27%;max-height:70%;display:flex;align-items:flex-start;gap:2.4cqw;padding:2.4cqw;
  background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 4px #4a5a6c;
  font-size:clamp(13px,4cqw,21px);line-height:1.5;cursor:pointer}
#dPort{flex:0 0 18%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  border:2px solid var(--line);font-size:.7em;color:var(--line);background:#22303f;overflow:hidden}
#dPort canvas{width:100%;height:auto;flex:0 0 auto;image-rendering:pixelated;filter:none!important}
#pTag{line-height:1.5}
#dBody{flex:1;min-width:0;padding-right:1em}
#dWho{color:var(--lit);font-size:.8em;margin-bottom:.15em;min-height:1.2em}
#dText.look{color:#d9c58f;letter-spacing:.04em}
#dWho.look{color:#8ea0c4}
#dText{white-space:pre-wrap;overflow-wrap:anywhere;min-height:4.5em}
#dChoices{display:flex;flex-direction:column;gap:.35em;margin-top:.1em}
#dChoices button{text-align:left;padding:.3em .7em;border-color:#4a5a6c;line-height:1.35}
#dChoices button::before{content:"▶";margin-right:.5em;opacity:0}
#dChoices button:focus{outline:none}
.ov button.sel{outline:3px solid var(--lit);outline-offset:2px}
#dChoices button.sel{border-color:var(--lit);outline:none;color:var(--lit)}
#dChoices button.sel::before{opacity:1}
#dNext{position:absolute;right:2.4cqw;bottom:1.2cqw;font-size:.8em;animation:bob .9s steps(2) infinite}
#stage.quiet #dWho{color:var(--deep)}
@keyframes bob{50%{transform:translateY(3px)}}

#tick{position:static;flex:0 0 auto;margin:0 1.6cqw 1cqw;display:flex;align-items:center;gap:.6em;padding:.15em .6em;min-height:1.75em;
  font-size:clamp(11px,3.4cqw,17px);line-height:1.35}
#tickT{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tick b{flex:0 0 auto;padding:.05em .45em;font-size:.85em;font-weight:700}
#tick i{font-style:normal;opacity:.7;flex:0 0 auto}
#tick.radio{background:#2a2016;color:#f2c14e;border:2px solid #8a6a4a;letter-spacing:.08em}
#tick.radio b{background:#8a6a4a;color:#2a2016}
#tick.tv{background:#0d3b8c;color:#fff;border-bottom:3px solid #ffd21e}
#tick.tv b{background:#d22a2a;color:#fff}
#tick.phone{background:#f4f4f6;color:#1b2430;border-radius:1em;box-shadow:0 3px 0 rgba(0,0,0,.35);padding:.35em .9em}
#tick.phone b{background:#1b2430;color:#f4f4f6;border-radius:.6em}
#tick.web{background:#fff;color:#1a0dab;border:1px solid #c8ccd2;text-decoration:underline;text-underline-offset:.2em}
#tick.web b,#tick.web i{color:#5f6368;background:#eceef1;text-decoration:none;display:inline-block}
#miniSkip{position:absolute;right:2cqw;bottom:2cqw;font-size:clamp(11px,3.1cqw,15px);padding:.2em .6em;opacity:.85}
#toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:var(--lit);color:#1b2430;
  padding:.3em 1em;font-weight:700;font-size:clamp(12px,3.6cqw,18px);white-space:nowrap}

#ovTl,#ovLog,#ovBag,#ovName,#ovMsg,#ovTea,#ovSong{z-index:6}
#ovTea{gap:1.6cqw;font-size:clamp(12px,3.4cqw,17px)}
#teaOrder{background:#f4ecd8;color:#1b2430;padding:.35em .7em;font-weight:700;border-left:.5em solid #8c5a3c}
#teaSop{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
#teaSop button{text-align:left;padding:.35em .6em}
#teaSop button[aria-pressed=true]{border-color:var(--lit);color:var(--lit)}
#teaSop button.slip{animation:slip .9s}
@keyframes slip{0%{background:#5a2a22}100%{background:var(--panel)}}
#teaGrid{display:grid;grid-template-columns:2.2em repeat(5,1fr);gap:.35em;align-items:center}
#teaGrid span{color:var(--dim);font-weight:700}
#teaGrid button{padding:.3em 0}
#teaGrid.off{opacity:.35;pointer-events:none}
#teaMsg{white-space:pre-wrap;min-height:4.2em;line-height:1.5;margin:0}
#ovEnd{z-index:4}
.ov label{display:block;margin:.9em 0 .3em}.ov label small{color:var(--dim)}
.ov input,.ov textarea{font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);padding:.5em;width:100%;
  border-radius:0;-webkit-user-select:text;user-select:text}
.ov textarea{resize:none;height:7.5em;line-height:1.5}
.ov input:focus-visible,.ov textarea:focus-visible{outline:3px solid var(--lit);outline-offset:1px}
.row{display:flex;gap:.6em;justify-content:flex-end;margin-top:1em}
.note{color:var(--dim);font-size:.85em;line-height:1.6;margin:.6em 0 0}
.avSet{display:grid;grid-template-columns:repeat(8,1fr);gap:.35em;margin-top:.7em}
.avSet button{padding:0;line-height:0;border-width:2px}
.avSet canvas{width:100%;height:auto;aspect-ratio:1;image-rendering:pixelated;display:block}
.avSet button[aria-pressed=true]{border-color:var(--lit);outline:2px solid var(--lit)}
.avRow{display:flex;gap:.8em;align-items:center}
.av{width:4.2em;height:4.2em;flex:0 0 auto;border:2px solid var(--line);background:#22303f;image-rendering:pixelated}
#avFile{position:absolute;opacity:0;width:1px;height:1px}
#avFile:focus-visible+label{outline:3px solid var(--lit);outline-offset:2px}
.fileBtn{display:inline-block!important;margin:0!important;padding:.35em .7em;border:2px solid var(--line);background:var(--panel);cursor:pointer}
#avErr{color:#f08a6c;margin:.4em 0 0;min-height:1.2em;font-size:.9em}
#msgAv{display:inline-block;width:1.8em;height:1.8em;margin-right:.5em;vertical-align:middle}
#msgErr{color:#f08a6c;min-height:1.4em;margin:.4em 0 0}
.quest{border-left:4px solid var(--lit);padding:.2em .8em;margin-bottom:1em}
.quest small{color:var(--dim)}
#bagListing{margin:0;padding:0;list-style:none}
#bagListing li{padding:.15em 0}
#bagListing li.x span{color:var(--dim);text-decoration:line-through;text-decoration-thickness:2px}
#bagListing li.k{color:var(--lit)}
#bagListing li::before{content:attr(data-m);display:inline-block;width:1.4em}.quest p{margin:.2em 0 0}
.item{display:block;width:100%;text-align:left;margin:0 0 .6em;padding:.5em .7em;border:2px solid #4a5a6c;background:var(--panel)}
button.item{border-color:var(--line)}
.item{display:flex!important;gap:.8em;align-items:center}
.item canvas{width:3em;height:3em;flex:0 0 auto;image-rendering:pixelated;background:#22303f;border:2px solid #4a5a6c}
.item b{display:block;color:var(--lit)}.item span{font-size:.9em;color:var(--dim)}
.ov{position:absolute;inset:0;background:#0f161e;display:flex;flex-direction:column;padding:3cqw;
  font-size:clamp(12px,3.5cqw,18px)}
.ov header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2cqw}
.ov h2{margin:0;font-size:1.25em;font-weight:700}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:1cqw}
#tl h3{margin:1.2em 0 .4em;padding:.15em .5em;font-size:.95em;font-weight:700;background:var(--c);color:#fff}
#tl h3:first-child{margin-top:0}
.yr{display:grid;grid-template-columns:3.2em 3em 1fr;gap:.5em;padding:.3em 0;border-bottom:1px solid #2b3848;
  opacity:.28;transition:opacity .4s}
.yr.on{opacity:1}
.yr b{font-weight:700}.yr.on b{color:var(--lit)}
.yr i{font-style:normal;color:var(--dim)}
.yr p{margin:0}
.yr p.deep{color:var(--deep)}
.yr p.minor{color:var(--dim);font-size:.88em}
.yr p.extra{color:#cfc6ad}
.yr p.person{color:#9fcfa8}
.yr p.person::before{content:"遇見　"}
.yr p.world{color:var(--dim);font-size:.9em}
.yr p.world::before{content:"同年　"}
.yr p.un.w::before{content:"同年　"}
.yr p.un{color:#4d5c6e}
#log p{margin:0 0 .7em}
#log span{color:var(--lit);font-size:.85em;display:block}

#title{align-items:center;justify-content:safe center;text-align:center;gap:2.6cqw;overflow-y:auto}
#title .kb{display:inline}
@media (pointer:coarse){#title .kb{display:none}}
#tOld{position:relative;display:inline-block}
#title.done #tOld{color:var(--dim);font-size:.62em;letter-spacing:.08em}
#title.done #tOld::after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:.14em;background:#e2402a;transform-origin:left;transform:scaleX(1)}
#title.done.anim #tOld::after{animation:strike .9s .4s both cubic-bezier(.6,0,.3,1)}
#tNew{display:none;color:var(--lit);margin-top:.35em}
#title.done #tNew{display:block}
#title.done.anim #tNew{animation:rise .8s 1.3s both}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(.3em)}to{opacity:1;transform:none}}
#ovSong{position:fixed;inset:0;z-index:50;gap:8px;align-items:stretch;overflow-y:auto;padding:12px max(12px,calc((100vw - 640px)/2));font-size:clamp(13px,3.6vw,18px)}
#songWin{font-size:clamp(10px,2.9vw,14px)!important}
#songYear{font-size:clamp(24px,8vw,44px)!important}
#songCap{font-size:clamp(14px,4vw,20px)!important}
#ovSong header{margin-bottom:0}
#songWin.ie,#songWin.chrome{align-self:center;width:90%}
#ovSong>*{flex:0 0 auto}
#songWin{transition:border-radius .8s,background .8s,border-color .8s,padding .8s;overflow:hidden;display:flex;flex-direction:column;font-size:clamp(10px,2.9cqw,14px)}
#songWin .bar,#songWin .menu,#songWin .addr,#songWin .status,#songWin .nav{display:none;align-items:center;gap:.5em;white-space:nowrap;overflow:hidden;flex:0 0 auto;line-height:1.5}
#ytWrap{position:relative;aspect-ratio:16/9;background:#000;flex:0 0 auto}
#ytWrap>*{position:absolute;inset:0;width:100%;height:100%;border:0}
#ytFallback{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8em;color:#e8dcc0;text-align:center;padding:1em}
#ytFallback a{color:var(--lit)}
/* 早期瀏覽器：藍色標題列、灰色立體邊框、選單列、網址列、狀態列 */
#songWin.ie{background:#d4d0c8;border:2px outset #fff;border-radius:0;padding:2px;color:#000;font-family:Tahoma,'PMingLiU',sans-serif}
#songWin.ie .bar{display:flex;background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font-weight:700;padding:.25em .4em}
#songWin.ie .bar i{margin-left:auto;display:flex;gap:2px;font-style:normal}
#songWin.ie .bar i b{background:#d4d0c8;color:#000;border:1px outset #fff;width:1.3em;text-align:center;font-size:.8em}
#songWin.ie .menu{display:flex;padding:.15em .5em;gap:1em}
#songWin.ie .addr{display:flex;padding:.2em .4em;border-top:1px solid #fff}
#songWin.ie .addr span{flex:1;background:#fff;border:1px inset #888;padding:.1em .4em;overflow:hidden;text-overflow:ellipsis}
#songWin.ie .addr em{font-style:normal;border:1px outset #fff;padding:0 .5em}
#songWin.ie .status{display:flex;border-top:1px solid #888;padding:.15em .4em;justify-content:space-between}
/* 後來的瀏覽器：上面是分頁，圓角的網址列，沒有選單和狀態列 */
#songWin.chrome{background:#dee1e6;border:1px solid #9aa0a6;border-radius:8px 8px 4px 4px;padding:0;color:#202124;font-family:Arial,'Noto Sans TC',sans-serif}
#songWin.chrome .bar{display:flex;padding:.4em .5em 0;align-items:flex-end}
#songWin.chrome .bar>span{background:#fff;border-radius:8px 8px 0 0;padding:.35em 1.6em .35em .8em;max-width:70%;overflow:hidden;text-overflow:ellipsis}
#songWin.chrome .bar i{display:none}
#songWin.chrome .addr{display:flex;background:#fff;padding:.35em .6em}
#songWin.chrome .addr label{display:none}
#songWin.chrome .addr span{flex:1;background:#f1f3f4;border-radius:999px;padding:.25em .9em;overflow:hidden;text-overflow:ellipsis}
#songWin.chrome .addr em{display:none}
/* 手機 App：整支手機的樣子，上面是狀態列，下面是導覽列 */
#songWin.app{background:#111;border:3px solid #2b2f38;border-radius:22px;padding:.3em;color:#fff;font-family:-apple-system,'Noto Sans TC',sans-serif;align-self:center;width:78%}
#songWin.app .status{display:flex;order:-1;justify-content:space-between;padding:.2em 1em;font-weight:700}
#songWin.app .status span:last-child::after{content:"  ▮▮▮ ▰"}
#songWin.app .nav{display:flex;justify-content:space-around;padding:.45em 0 .2em;font-size:1.2em;opacity:.85}
#songWalk{width:100%;height:auto;aspect-ratio:352/62;display:block;image-rendering:pixelated;margin-bottom:-1px}
#songPlay{align-self:center;padding:.6em 1.4em;border-color:var(--lit);color:var(--lit)}
#ovSong[hidden].pre{display:flex!important;visibility:hidden;pointer-events:none}
.credits{color:var(--dim);font-size:.72em;line-height:1.6;max-width:30em;margin:0}
.credits a{color:inherit}
#songYearRow{display:flex;align-items:baseline;gap:.8em;justify-content:center}
#songYear{font-size:clamp(22px,8cqw,44px);font-weight:700;color:var(--lit);letter-spacing:.06em}
#songAge,#songEra{color:var(--dim)}
#songCap{min-height:3.2em;text-align:center;line-height:1.6;margin:0;font-size:clamp(13px,3.9cqw,20px);transition:opacity .4s}
#songBar{height:4px;background:#2b3848}#songBar i{display:block;height:100%;width:0;background:var(--lit)}
#songEdit{width:100%;height:5em;font:12px monospace}
#ovEnd{align-items:center;justify-content:center;text-align:center;gap:3cqw}
#ovEnd h2{margin:0;font-size:1.6em;color:var(--lit)}
#ovEnd p{margin:0;max-width:26em;line-height:1.7}
#title h1{margin:0;font-size:clamp(20px,7cqw,40px);letter-spacing:.12em;font-weight:700}
#title p{margin:0;color:var(--dim)}
#menu{display:flex;flex-direction:column;gap:.6em;min-width:50%}
#menu button{padding:.55em 1em}
#title small{color:var(--dim);font-size:.75em;line-height:1.7}

#pad{display:none;width:100%;max-width:704px;justify-content:space-between;align-items:center;padding:0 12px}
@media (pointer:coarse){#pad{display:flex}}
#dpad{display:grid;grid-template:repeat(3,52px)/repeat(3,52px)}
#dpad button,#btnA{border-radius:0;font-size:20px;padding:0;touch-action:none}
#dpad [data-d=up]{grid-area:1/2}#dpad [data-d=left]{grid-area:2/1}
#dpad [data-d=right]{grid-area:2/3}#dpad [data-d=down]{grid-area:3/2}
#btnA{width:84px;height:84px;border-radius:50%;font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="hud" hidden>
    <div id="count"></div>
    <div id="hudBtns">
      <button id="bBag">背包</button><button id="bTl">年表</button><button id="bLog">紀錄</button><button id="bSnd" aria-pressed="true">音</button>
    </div>
  </div>
  <div id="tick" hidden aria-live="polite"><b id="tickB"></b><i id="tickY"></i><span id="tickT"></span></div>
  <canvas id="cv"></canvas>
  <div id="toast" hidden></div>
  <button id="miniSkip" hidden>跳過小遊戲</button>
  <div id="dlg" hidden>
    <div id="dPort"><canvas id="pc" width="96" height="78"></canvas><span id="pTag"></span></div>
    <div id="dBody"><div id="dWho"></div><div id="dText"></div><div id="dChoices" hidden></div></div>
    <div id="dNext">▼</div>
  </div>
  <div id="ovTl" class="ov" hidden>
    <header><h2>年表</h2><button id="tlClose">關閉</button></header>
    <div id="tl" class="scroll"></div>
  </div>
  <div id="ovLog" class="ov" hidden>
    <header><h2>對話紀錄</h2><button id="logClose">關閉</button></header>
    <div id="log" class="scroll"></div>
  </div>
  <div id="ovBag" class="ov" hidden>
    <header><h2 id="bagTitle">背包</h2><button id="bagClose">關閉</button></header>
    <p id="bagHint" class="note" style="margin:0 0 .8em" hidden>用 ↑↓ 選一樣，再按調查；或直接點它。</p>
    <div class="quest"><small>目前的線索</small><p id="bagQuest"></p></div>
    <div id="bagMemo" class="quest" style="border-color:#8ea0c4"><small>劃掉的，和留下的</small><ul id="bagListing"></ul></div>
    <div id="bagList" class="scroll"></div>
  </div>
  <div id="ovName" class="ov" hidden>
    <header><h2>在認識我之前</h2></header>
    <div class="scroll">
      <label for="nm">你是誰？</label><input id="nm" maxlength="12" autocomplete="off" placeholder="怎麼稱呼你">
      <label for="intro">用一句話介紹你自己 <small>選填</small></label><input id="intro" maxlength="30" autocomplete="off">
      <label>你的形象是什麼？ <small>選填，挑一個或上傳自己的圖</small></label>
      <div class="avRow"><canvas id="avPrev" class="av" width="32" height="32"></canvas>
        <div><input type="file" id="avFile" accept="image/*"><label for="avFile" class="fileBtn">上傳自己的圖</label>
        <button id="avClear" hidden>不放圖</button></div></div>
      <div id="avSet" class="avSet" role="group" aria-label="預設形象"></div>
      <p id="avErr"></p>
      <p class="note" id="nameNote"></p>
      <div class="row"><button id="nmBack">返回</button><button id="nmGo" disabled>走進去</button></div>
    </div>
  </div>
  <div id="ovMsg" class="ov" hidden>
    <header><h2><canvas id="msgAv" class="av" width="32" height="32" hidden></canvas>換你說</h2><button id="msgLater">之後再說</button></header>
    <div class="scroll">
      <p class="note" id="msgReward" style="color:var(--line);margin-top:0"></p>
      <label for="msg">看完之後，想對我說的話</label><textarea id="msg" maxlength="500"></textarea>
      <label for="contact">怎麼找到你 <small>選填，想收到回禮再填</small></label><input id="contact" maxlength="60" autocomplete="off">
      <p class="note" id="msgPrivacy"></p><p id="msgErr"></p>
      <div class="row"><button id="msgSend">送出留言</button></div>
    </div>
  </div>
  <div id="ovSong" class="ov" hidden>
    <header><h2 id="songTitle"></h2><button id="songClose">跳過</button></header>
    <canvas id="songWalk" width="1056" height="186"></canvas>
    <div id="songWin" class="ie">
      <div class="bar"><span id="songWinTitle"></span><i><b>_</b><b>□</b><b>×</b></i></div>
      <div class="menu"><span>檔案(F)</span><span>編輯(E)</span><span>檢視(V)</span><span>我的最愛(A)</span><span>工具(T)</span></div>

   所以畫面的「列數」依可用高度決定：高度夠就 9 列，不夠就少幾列（最少 5 列）。格子大小不變，鏡頭照樣跟著角色。 */
function fit(){
  const w=Math.min(704,innerWidth-16), scale=w/(VW*T), pad=$('pad'), padH=getComputedStyle(pad).display==='none'?0:pad.offsetHeight+10;
  const chrome=$('hud').offsetHeight+$('tick').offsetHeight+10, avail=innerHeight-16-padH-chrome;
  const rows=Math.max(5,Math.min(9,Math.floor(avail/(T*scale))));
  if(!isFinite(rows)) return;
  if(rows!==VH||!cv.style.aspectRatio){ VH=rows; cv.height=VH*T*SC; cv.style.aspectRatio=`${VW*T}/${VH*T}`; cam.snap=true; }
}

function runFrag(f){

function finishFrag(f){

/* 打開家具：裡面的東西掉到旁邊的地上（一次三樣）。找位置的規則：離家具越近越好、不壓到別的東西、
   掉出來的東西彼此不緊貼、不能把訪客或出口堵死。 */
function spillSpots(fu,n){
  const m=MAPS[st.room], H=m.length, Wd=m[0].length, key=(x,y)=>x+','+y, ex=m[H-1].indexOf('E'), N4=[[1,0],[-1,0],[0,1],[0,-1]];
  const es=ents(), floor=(x,y)=>y>=0&&y<H&&x>=0&&x<Wd&&m[y][x]==='.';
  const occ=new Set(es.map(e=>key(e.x,e.y))); const keep=new Set([key(st.x,st.y),key(ex,H-2),key(ex,H-3)]);
  const small=es.filter(e=>e.kind!=='furn').map(e=>[e.x,e.y]);                       // 家具以外的東西：新掉出來的不能貼著它們
  const groups=[...es.filter(e=>e.kind!=='furn').map(e=>[[e.x,e.y]]), ...FURN.filter(u=>u.room===st.room).map(u=>{ const t=[]; for(let dy=0;dy<u.h;dy++)for(let dx=0;dx<u.w;dx++)t.push([u.x+dx,u.y+dy]); return t; })];
  // 放下去之後：訪客走得到出口，而且房間裡每一樣東西（含每一件家具、每一樣已經掉出來的）旁邊都還有走得到的空位
  const ok=added=>{ const block=new Set([...occ,...added.map(a=>key(a[0],a[1]))]); const q=[[st.x,st.y]], seen=new Set([key(st.x,st.y)]);
    while(q.length){ const [x,y]=q.pop(); N4.forEach(([dx,dy])=>{ const k=key(x+dx,y+dy); if(floor(x+dx,y+dy)&&!seen.has(k)&&!block.has(k)){ seen.add(k); q.push([x+dx,y+dy]); } }); }
    if(!seen.has(key(ex,H-2))) return false;
    return [...groups,...added.map(a=>[a])].every(t=>t.some(([x,y])=>N4.some(([dx,dy])=>seen.has(key(x+dx,y+dy))))); };
  const q=[], seen=new Set(), out=[];
  for(let dy=-1;dy<=fu.h;dy++) for(let dx=-1;dx<=fu.w;dx++){ const x=fu.x+dx,y=fu.y+dy; if((dx<0||dx>=fu.w||dy<0||dy>=fu.h)&&floor(x,y)&&!seen.has(key(x,y))){ seen.add(key(x,y)); q.push([x,y,1]); } }
  while(q.length&&out.length<n){ const [x,y,d]=q.shift(); if(d>14) break;
    const near=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])<=1;
    if(!occ.has(key(x,y))&&!keep.has(key(x,y))&&!out.some(o=>near(o,[x,y]))&&!small.some(o=>near(o,[x,y]))&&ok(out.concat([[x,y]]))) out.push([x,y]);
    N4.forEach(([dx,dy])=>{ const k=key(x+dx,y+dy); if(floor(x+dx,y+dy)&&!seen.has(k)){ seen.add(k); q.push([x+dx,y+dy,d+1]); } }); }
  return out;
}
function openFurn(fu){

    if(!spots.length) return say(`${fu.label}旁邊太擠了，東西掉不出來。\n先把地上的看一看。`);
    spots.forEach((p,i)=>{ st.spill[left[i]]=p; spillFx[left[i]]={x:fu.x+fu.w/2-.5,y:fu.y+fu.h/2-.5,t0:performance.now()+i*90}; }); st.openF[fu.id]=true; store.set(); blip();
    const names=spots.map((p,i)=>F.find(f=>f.id===left[i]).label).join('、'), more=left.length-spots.length;
    return say(`${first?'打開':'再翻一次'}${fu.label}。\n${names}掉了出來。`+(more>0?`\n（裡面還有 ${more} 樣）`:'')); }

      if(st.trashed){ g.fillStyle='#e8dcc0'; g.fillRect(px+13,py+5,6,4); } tags.push([px+T/2,py-2,e.f.label,st.wallLit&&!st.trashed?'#f2c14e':'#e8dcc0']); return; }
    if(e.kind==='frag'){ const sf=spillFx[e.f.id]; if(sf&&!reduce){ const q=(performance.now()-sf.t0)/420; if(q<0) return; if(q<1){ const ez=1-(1-q)*(1-q); px=(sf.x+(e.x-sf.x)*ez)*T; py=(sf.y+(e.y-sf.y)*ez)*T-Math.sin(q*Math.PI)*22; } else delete spillFx[e.f.id]; }
      const f=e.f, locked=(f.needs&&!st.open[f.id])||needMore(f)>0||(f.after&&!got(f)&&!f.after.every(id=>st.got[id])), prop=f.type==='prop', rows=SPRITES[SPRITE_OF[f.id]];
      const on=f.type==='media'&&!!newsNow&&!$('tick').hidden; let top=py+8;
      if(!f.on){ g.fillStyle='rgba(0,0,0,.25)'; g.fillRect(px+3,py+T-4,T-6,3); }
      g.globalAlpha=got(f)&&!prop?.6:1;
      const lift=f.on?((FURN.find(u=>u.id===f.on)||{}).kind||'').startsWith('bed')?4:11:0;
      if(rows) top=drawObj(px,py-lift,rows,f.color,on,f.big?3:2);
      else { g.fillStyle=f.color; prop?g.fillRect(px+7,py+11,T-14,T-15):g.fillRect(px+4,py+8,T-8,T-12); if(f.type==='media'){ g.fillStyle=on?'#f2c14e':'#9fd0e8'; g.fillRect(px+8,py+12,T-16,T-22); } }
      g.globalAlpha=1;
      const [fdx,fdy]=D[st.dir], faced=st.x+fdx===e.x&&st.y+fdy===e.y;
      if(!(f.on||f.quietTag)||faced) tags.push([px+T/2,top-8,(prop||f.type==='media'?'':got(f)?'✓ ':locked?'🔒 ':'')+f.label+(f.parts&&!got(f)&&touched(f)?` ${f.parts.filter(p=>st.got[p.id]).length}/${f.parts.length}`:''), got(f)?(prop?'#6f7f93':'#f2c14e'):locked?'#8ea0c4':'#e8dcc0']); }
    if(e.kind==='self'){ const sp=SPEAKERS[e.sp], oy=person(px,py,sp,facing[e.sp]||'down',0); tags.push([px+T/2,oy-8,sp.name]); }
    if(e.kind==='now'){ const w=nowNpc.target!=null, oy=person(px,nowNpc.y*T,SPEAKERS.now,w?'down':(facing.now||'down'),w?Math.floor(nowNpc.y*3)%2+1:0); tags.push([px+T/2,oy-8,SPEAKERS.now.name,'#f2c14e']); }
  });
  const meC={x:meX+T/2,y:meY+T/2}, nearTag=t=>st.room==='hall'||(t[2].startsWith('▼')||t[2].startsWith(CONFIG.me))||Math.hypot(t[0]-meC.x,(t[1]+14)-meC.y)<T*3.4;
  if(st.room!=='hall') ents().forEach(e=>{ if(e.kind!=='frag') return; const f=e.f; if(!['personal','deep','extra','person'].includes(f.type)||got(f)) return;
    const cx=e.x*T+T/2, cy=e.y*T+T/2; if(Math.hypot(cx-meC.x,cy-meC.y)<T*3.4) return;
    g.fillStyle='#f2c14e'; g.fillRect(cx-1,e.y*T-3,3,3); g.fillStyle='rgba(242,193,78,.35)'; g.fillRect(cx-2,e.y*T-4,5,5); });
  tags.filter(nearTag).forEach(t=>tag(...t));
  if(fx){ const k=Math.min(1,fx.t/.65), e=1-(1-k)*(1-k), x=(fx.fx+(fx.tx-fx.fx)*e)*T+T/2, y=(fx.fy+(fx.ty-fx.fy)*e)*T-6-Math.sin(k*Math.PI)*14;
    if(fx.t>.65){ g.fillStyle=`rgba(242,193,78,${(1-(fx.t-.65)/.35)*.8})`; g.fillRect(fx.tx*T,fx.ty*T,T,T); }
    g.fillStyle='#e8dcc0'; g.fillRect(x-14,y-14,28,28); g.fillStyle='#22303f'; g.fillRect(x-12,y-12,24,24); drawIcon(g,x-12,y-12,2,fx.id); }
  // 左下角：身上帶著的東西
  g.setTransform(SC,0,0,SC,0,0);
  if(!dq) st.bag.forEach((id,i)=>{ const x=6+i*24, y=VH*T-26; g.fillStyle='#e8dcc0'; g.fillRect(x,y,22,22); g.fillStyle='#22303f'; g.fillRect(x+2,y+2,18,18); drawIcon(g,x+2,y+2,1.5,id); });
  if(fadeA>0){ g.setTransform(SC,0,0,SC,0,0); g.fillStyle=`rgba(0,0,0,${fadeA})`; g.fillRect(0,0,VW*T,VH*T); }
}

/* ---------- 主迴圈與輸入 ---------- */
let last=0;
function loop(ts){
  const dt=Math.min(50,ts-last||16); last=ts;
  if(started){
    if(!overlayOpen()) st.ms+=dt;
    if(fadeDir){ fadeA+=fadeDir*dt/180; if(fadeA>=1){ fadeA=1; fadeDir=-1; fadeCb&&fadeCb(); fadeCb=null; } if(fadeA<=0){ fadeA=0; fadeDir=0; } }
    tickDlg(dt); tickNow(dt);
    if(toastT>0&&(toastT-=dt)<=0) $('toast').hidden=true;
    tickNews(dt);
    if(fx&&(fx.t+=dt/700)>=1){ const cb=fx.cb; fx=null; cb(); }
    if(mv){ mv.t+=dt/(st.room==='hall'&&st.ride?RIDES[st.ride.kind].ms:150); if(mv.t>=1){ const m=mv; st.x=mv.tx; st.y=mv.ty; mv=null; onStep(m.fx,m.fy); } }
    const busy=fx||dq||mv||fadeDir||overlayOpen()||nowNpc&&nowNpc.target!=null;
    if(!busy){ const d=['up','down','left','right'].find(k=>held[k]); if(d) tryMove(d); }
    mini?mini.draw(dt):draw();
    if(!$('ovSong').hidden) songDraw(); else if(!mini) bgmTo(st.room);
  }
  requestAnimationFrame(loop);
}
function clearHeld(){ for(const k in held) held[k]=false; }
function action(){ if(overlayOpen()) return ovConfirm(); if(fx||mini) return; if(dq&&dq.choosing) return choose(dq.sel<0?0:dq.sel); if(dq) return advance(); if(mv||fadeDir||nowNpc&&nowNpc.target!=null) return; interact(); }
const KEY={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(!$('ovSong').hidden) closeSong(); else if(!$('ovMsg').hidden){ $('ovMsg').hidden=true; openEnd(); } else if(!$('ovEnd').hidden) $('ovEnd').hidden=true; else if(!$('ovName').hidden) nameBack(); else if(!$('ovBag').hidden) $('ovBag').hidden=true; else if(!$('ovLog').hidden) $('ovLog').hidden=true; else if(!$('ovTl').hidden) closeTl(); return; }
  if(overlayOpen()){ const tag=document.activeElement&&document.activeElement.tagName; if(tag==='INPUT'||tag==='TEXTAREA') return;
    const d=KEY[e.key]; if(d){ ovMove(d==='up'||d==='left'?-1:1); e.preventDefault(); } else if((e.key==='z'||e.key==='Z')){ ovConfirm(); e.preventDefault(); } return; }
  if(mini){ if(KEY[e.key]) held[KEY[e.key]]=true; if(['z','Z','Enter',' '].includes(e.key)) held.a=true; e.preventDefault(); return; }
  if(dq&&dq.choosing){ const d=KEY[e.key]; if(d==='up'||d==='left'){ moveChoice(-1); e.preventDefault(); } else if(d==='down'||d==='right'){ moveChoice(1); e.preventDefault(); }
    else if(['z','Z','Enter',' '].includes(e.key)&&!e.repeat){ choose(dq.sel<0?0:dq.sel); e.preventDefault(); } return; }
  if(KEY[e.key]){ held[KEY[e.key]]=true; e.preventDefault(); }
  if(['z','Z','Enter',' '].includes(e.key)&&!e.repeat){ if(document.activeElement.tagName==='BUTTON') document.activeElement.blur(); action(); e.preventDefault(); }
});
addEventListener('keyup',e=>{ if(KEY[e.key]) held[KEY[e.key]]=false; if(['z','Z','Enter',' '].includes(e.key)) held.a=false; });
addEventListener('blur',clearHeld);
document.querySelectorAll('#dpad button').forEach(b=>{
  const d=b.dataset.d, off=()=>held[d]=false;
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); const step=d==='up'||d==='left'?-1:1; if(overlayOpen()) return ovMove(step); if(dq&&dq.choosing) return moveChoice(step); held[d]=true; });
  ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,off));
});
$('btnA').addEventListener('click',action);
$('btnA').addEventListener('pointerdown',e=>{ e.preventDefault(); if(mini) held.a=true; }); ['pointerup','pointerleave','pointercancel'].forEach(n=>$('btnA').addEventListener(n,()=>held.a=false));
cv.addEventListener('click',action); $('dlg').addEventListener('click',advance);
$('bTl').onclick=()=>{ if(!dq&&!ending) openTl('play'); };
$('bLog').onclick=()=>openLog();
$('bBag').onclick=()=>{ if(!dq&&!ending) openBag(); };
$('bagClose').onclick=()=>$('ovBag').hidden=true;
$('bSnd').onclick=e=>{ sound=!sound; if(bgmEl) bgmEl.muted=!sound; e.currentTarget.setAttribute('aria-pressed',sound); e.currentTarget.style.opacity=sound?1:.4; };
$('tlClose').onclick=closeTl; $('logClose').onclick=()=>$('ovLog').hidden=true;

/* ---------- 標題 ---------- */
function begin(state){ fit(); st=state; if((st.ended||st.wallLit)&&!REQ.every(f=>st.got[f.id])){ st.ended=false; st.wallLit=false; st.trashed=false; st.sent=false; }
  st.bag=(st.bag||[]).filter(id=>ITEMS[id]);
  if(st.opened&&!st.trashed&&!st.ended&&!st.bag.includes('list')) st.bag.unshift('list');   // 舊存檔補發清單
  started=true; $('title').hidden=true; $('hud').hidden=false; cam.snap=true;
  if(st.ended) nowNpc={x:25,y:1,target:null}; hud(); store.set();
  if(!st.opened) say(OPENING,()=>{ st.opened=true; store.set(); }); else checkEnding(); }
$('tSub').textContent=CONFIG.subtitle;
const AV=32; let avatarImg=null, avatarData='';
function paintAv(cvs){ const c=cvs.getContext('2d'); c.clearRect(0,0,AV,AV); c.imageSmoothingEnabled=false; if(avatarImg) c.drawImage(avatarImg,0,0,AV,AV); }
function setAvatar(data,then){
  avatarData=data||''; if(!data){ avatarImg=null; then&&then(); return; }
  const im=new Image(); im.onload=()=>{ avatarImg=im; then&&then(); }; im.onerror=()=>{ avatarImg=null; avatarData=''; then&&then(); }; im.src=data;
}
$('avFile').onchange=e=>{
  const f=e.target.files[0]; $('avErr').textContent=''; if(!f) return;
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{ const s=Math.min(im.width,im.height), c=document.createElement('canvas'); c.width=c.height=AV;
    const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,AV,AV);
    URL.revokeObjectURL(url); unpress(); setAvatar(c.toDataURL('image/png'),()=>{ paintAv($('avPrev')); $('avClear').hidden=false; }); };
  im.onerror=()=>{ URL.revokeObjectURL(url); e.target.value=''; $('avErr').textContent='這個檔案讀不出來。請換一張 JPG 或 PNG。'; };
  im.src=url;
};
const presetData=a=>{ const c=document.createElement('canvas'); c.width=c.height=AV; const x=c.getContext('2d'); x.fillStyle=a.bg; x.fillRect(0,0,AV,AV); pix(x,4,4,2,a.map,a.color); return c.toDataURL('image/png'); };
const unpress=()=>document.querySelectorAll('#avSet button').forEach(b=>b.setAttribute('aria-pressed','false'));
AVATARS.forEach(a=>{ const b=document.createElement('button'), data=presetData(a), cv2=document.createElement('canvas'); cv2.width=cv2.height=AV;
  b.type='button'; b.setAttribute('aria-label',a.name); b.setAttribute('aria-pressed','false'); b.title=a.name; b.appendChild(cv2);
  const im=new Image(); im.onload=()=>cv2.getContext('2d').drawImage(im,0,0); im.src=data;
  b.onclick=()=>{ $('avFile').value=''; $('avErr').textContent=''; unpress(); b.setAttribute('aria-pressed','true'); setAvatar(data,()=>{ paintAv($('avPrev')); $('avClear').hidden=false; }); };
  $('avSet').appendChild(b); });
$('avClear').onclick=()=>{ unpress(); $('avFile').value=''; setAvatar('',()=>{ paintAv($('avPrev')); $('avClear').hidden=true; }); };
const nameBack=()=>{ $('ovName').hidden=true; $('mNew').focus(); };
$('mNew').onclick=()=>{ const b=$('mNew'); if(store.get()&&!b.dataset.sure){ b.dataset.sure='1'; b.textContent='再按一次：清掉進度，從頭開始'; return; }
  $('nameNote').textContent=CONFIG.nameNote; $('ovName').hidden=false; $('nm').focus(); };
$('nm').oninput=()=>$('nmGo').disabled=!$('nm').value.trim();
const nameGo=()=>{ const n=$('nm').value.trim(); if(!n) return; $('ovName').hidden=true; begin(Object.assign(fresh(),{name:n,intro:$('intro').value.trim(),avatar:avatarData})); };
$('nmGo').onclick=nameGo; $('nmBack').onclick=nameBack;
['nm','intro'].forEach(id=>$(id).addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing) nameGo(); }));
$('msgSend').onclick=sendMsg; $('msgLater').onclick=()=>{ $('ovMsg').hidden=true; openEnd(); };
$('endSong').textContent=SONG.label; $('endSong').onclick=()=>openSong(false); $('songPlay').onclick=()=>{ try{ yt.playVideo(); }catch(e){} $('songPlay').hidden=true; }; $('songClose').onclick=closeSong;
$('songStamp').onclick=()=>{ const s_=songState(); if(s_) $('songEdit').value+=`{ t:${s_.t.toFixed(1)}, text:'' },\n`; };
$('endTl').onclick=()=>openTl('all',openEnd); $('endMsg').onclick=openMsg; $('endStay').onclick=()=>$('ovEnd').hidden=true; $('endCover').onclick=()=>showCover(true);
$('mLoad').onclick=()=>{ const sv=store.get(); if(sv) setAvatar(sv.avatar,()=>begin(Object.assign(fresh(),sv))); };
$('mAll').onclick=()=>{ if(CONFIG.overviewUrl) location.href=CONFIG.overviewUrl; else openTl('all'); };
showCover(false);
document.body.appendChild($('ovSong'));   // 搬到最外層，才能蓋滿整個螢幕
fit(); setTimeout(fit,300);
requestAnimationFrame(loop);
</script>
